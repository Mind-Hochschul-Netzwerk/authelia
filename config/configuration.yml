---
# yaml-language-server: $schema=https://www.authelia.com/schemas/v4.38/json-schema/configuration.json

server:
  address: 'tcp://:9091'
  asset_path: '/config/assets'

log:
  level: 'debug'

totp:
  issuer: 'MHN'

authentication_backend:
  ldap:
    address: 'ldaps://ldap'
    tls:
      skip_verify: true
    base_dn: 'dc=mind-hochschul-netzwerk,dc=de'
    user: 'cn=admin,dc=mind-hochschul-netzwerk,dc=de'
    additional_users_dn: 'ou=people'
    # employeeType=1 <=> login disabled
    users_filter: '(&(|({username_attribute}={input})(mail={input}))(objectClass=inetOrgPerson)(!(employeeType=1)))'
    additional_groups_dn: 'ou=groups'
    groups_filter: '(&(member={dn})(objectclass=groupOfNames))'
    attributes:
      group_name: 'cn'
      username: 'cn'
      distinguished_name: 'distinguishedName'
      family_name: 'sn'
      display_name: 'displayName'
      given_name: 'givenName'
      mail: 'mail'
  password_reset:
    disable: false
    custom_url: 'https://mitglieder.{{ env "DOMAINNAME" }}/lost-password'
  password_change:
    disable: false

access_control:
  default_policy: 'one_factor'
  rules:
    - domain: 'sso.{{ env "DOMAINNAME" }}'
      policy: 'one_factor'
    - domain: 'paperless.{{ env "DOMAINNAME" }}'
      policy: 'two_factor'
      subject:
      - ['group:finanzteam']
      - ['group:vorstand']

session:
  cookies:
    - name: 'authelia_session'
      domain: '{{ env "DOMAINNAME" }}'
      authelia_url: 'https://sso.{{ env "DOMAINNAME" }}'
      expiration: '1 hour'
      inactivity: '5 minutes'
      default_redirection_url: 'https://mitglieder.{{ env "DOMAINNAME" }}/'

  redis:
    host: 'redis'
    port: 6379

regulation:
  max_retries: 3
  find_time: '2 minutes'
  ban_time: '5 minutes'

storage:
  postgres:
    address: 'tcp://db:5432'
    schema: 'public'
    username: authelia
    database: authelia

identity_providers:
  oidc:
    jwks:
      - key: {{ secret "/config/secrets/oidc/jwks/rsa.2048.key" | mindent 10 "|" | msquote }}
    cors:
      endpoints:
        - 'authorization'
        - 'token'
        - 'revocation'
        - 'introspection'
        - 'userinfo'
      allowed_origins_from_client_redirect_uris: true
    minimum_parameter_entropy: 4
    authorization_policies:
      aufnahme:
        default_policy: 'deny'
        rules:
          - policy: 'one_factor'
            subject: ['group:aufnahme']
    clients:
      - client_id: paperless
        client_name: Paperless
        client_secret: {{ secret "/config/secrets/oidc/clients/paperless" }}
        public: false
        redirect_uris:
          - https://paperless.{{ env "DOMAINNAME" }}/accounts/oidc/authelia/login/callback/
        scopes:
          - openid
          - groups
          - profile
          - email
        authorization_policy: 'two_factor'
        consent_mode: implicit
        token_endpoint_auth_method: client_secret_post

      - client_id: vikunja
        client_name: Vikunja
        client_secret: {{ secret "/config/secrets/oidc/clients/vikunja" }}
        public: false
        redirect_uris:
          - https://tasks.{{ env "DOMAINNAME" }}/auth/openid/authelia
        scopes:
          - openid
          - groups
          - profile
          - email
        authorization_policy: 'one_factor'
        consent_mode: implicit

      - client_id: listmonk
        client_name: Listmonk
        client_secret: {{ secret "/config/secrets/oidc/clients/listmonk" }}
        public: false
        redirect_uris:
          - https://listmonk.{{ env "DOMAINNAME" }}/auth/oidc
        scopes:
          - openid
          - groups
          - profile
          - email
        authorization_policy: 'two_factor'
        consent_mode: implicit
        grant_types:
          - 'refresh_token'
          - 'authorization_code'
        response_types:
          - code

      - client_id: outline
        client_name: Outline
        client_secret: {{ secret "/config/secrets/oidc/clients/outline" }}
        public: false
        redirect_uris:
          - https://wiki.{{ env "DOMAINNAME" }}/auth/oidc.callback
        scopes:
          - openid
          - profile
          - email
        userinfo_signed_response_alg: 'none'
        token_endpoint_auth_method: client_secret_post
        pre_configured_consent_duration: 1y
        authorization_policy: one_factor

      - client_id: mitglieder
        client_name: Mitgliederverzeichnis
        client_secret: {{ secret "/config/secrets/oidc/clients/mitglieder" }}
        public: false
        redirect_uris:
          - https://mitglieder.{{ env "DOMAINNAME" }}/login
        scopes:
          - openid
          - email
          - profile
        authorization_policy: one_factor
        consent_mode: implicit

      - client_id: aufnahme
        client_name: Aufnahmetool
        client_secret: {{ secret "/config/secrets/oidc/clients/aufnahme" }}
        public: false
        redirect_uris:
          - https://aufnahme.{{ env "DOMAINNAME" }}/login
        scopes:
          - openid
          - email
          - profile
          - groups
        authorization_policy: aufnahme
        consent_mode: implicit

      - client_id: listig
        client_name: Listig
        client_secret: {{ secret "/config/secrets/oidc/clients/listig" }}
        public: false
        redirect_uris:
          - https://lists.{{ env "DOMAINNAME" }}/_/login/oidc
        scopes:
          - openid
          - email
        authorization_policy: one_factor
        consent_mode: implicit

      - client_id: helios
        client_name: Wahlsystem
        client_secret: {{ secret "/config/secrets/oidc/clients/helios" }}
        public: false
        redirect_uris:
          - https://wahl.{{ env "DOMAINNAME" }}/auth/after/
        scopes:
          - openid
          - email
          - profile
          - groups
        authorization_policy: one_factor
        consent_mode: implicit
        token_endpoint_auth_method: client_secret_post
